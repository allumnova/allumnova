worker_processes 1;

events { worker_connections 1024; }

http {
    sendfile on;
    client_max_body_size 50M;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Docker DNS resolver
    resolver 127.0.0.11 valid=30s;

    # HTTP - Redirect to HTTPS
    server {
        listen 80;
        server_name allumnova.cloud;

        # Let's Encrypt Challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://\$host\$request_uri;
        }
    }

    # HTTPS - Main Site
    server {
        listen 443 ssl;
        server_name allumnova.cloud;

        ssl_certificate /etc/letsencrypt/live/allumnova.cloud/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/allumnova.cloud/privkey.pem;

        # SSL Optimization
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        location / {
            set \$frontend_host frontend;
            proxy_pass http://\$frontend_host:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade \$http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host \$host;
            proxy_cache_bypass \$http_upgrade;
        }

        location /api {
            set \$backend_host backend;
            proxy_pass http://\$backend_host:5000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade \$http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host \$host;
            proxy_cache_bypass \$http_upgrade;
        }

        location /socket.io {
            set \$socket_host backend;
            proxy_pass http://\$socket_host:5000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade \$http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host \$host;
        }
    }
}
