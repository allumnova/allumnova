worker_processes 1;

events { worker_connections 1024; }

http {
    sendfile on;
    client_max_body_size 50M;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    upstream frontend {
        server frontend:3000;
    }

    upstream backend {
        server backend:5000;
    }

    upstream socket_io {
        server backend:5000;
    }

    # HTTP - Redirect to HTTPS
    server {
        listen 80;
        server_name allumnova.cloud;

        # Let's Encrypt Challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://\$host\$request_uri;
        }
    }

    # HTTPS - Main Site
    server {
        listen 443 ssl;
        server_name allumnova.cloud;

        ssl_certificate /etc/letsencrypt/live/allumnova.cloud/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/allumnova.cloud/privkey.pem;

        # SSL Optimization (optional but recommended)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade \$http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host \$host;
            proxy_cache_bypass \$http_upgrade;
        }

        location /api {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade \$http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host \$host;
            proxy_cache_bypass \$http_upgrade;
        }

        location /socket.io {
            proxy_pass http://socket_io;
            proxy_http_version 1.1;
            proxy_set_header Upgrade \$http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host \$host;
        }
    }
}
