name: allumnova_mobile
description: High-fidelity professional hub for campus innovators.
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  dio: ^5.4.1
  flutter_secure_storage: ^9.0.0
  google_fonts: ^6.2.1
  lucide_icons: ^0.320.0
  framer_motion_flutter: ^0.1.0 # Hypothetical or custom equivalent for smooth transitions
  flutter_blurhash: ^0.8.0
  intl: ^0.19.0
  shimmer: ^3.0.0
  glass: ^1.1.0
  go_router: ^13.2.0
  firebase_core: ^2.27.0
  firebase_messaging: ^14.8.2
  flutter_local_notifications: ^17.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-Bold.ttf
          weight: 700
        - asset: assets/fonts/Outfit-Black.ttf
          weight: 900
        - asset: assets/fonts/Outfit-Medium.ttf
          weight: 500
