services:
  nginx:
    image: nginx:alpine
    container_name: allumnova_nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - allumnova-network
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: allumnova_frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    ports:
      - "3000:3000"
    networks:
      - allumnova-network
    restart: always

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/allumnova?schema=public
      - JWT_SECRET=supersecret
      - REDIS_URL=redis://redis:6379
      - NODE_ENV=development
      - PORT=5000
      - CHOKIDAR_USEPOLLING=true
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM}
      - FRONTEND_URL=http://localhost:8080
    env_file:
      - ./backend/.env
    ports:
      - "5000:5000"
    # duplicate env_file and ports removed
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - allumnova-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:5000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: sh -c "npx prisma generate && npx prisma db push --accept-data-loss && npm run dev"
    restart: always

  worker:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/allumnova?schema=public
      - REDIS_URL=redis://redis:6379
      - NODE_ENV=development
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - allumnova-network
    command: node src/worker/index.js
    restart: always

  db:
    image: postgres:15-alpine
    container_name: allumnova_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: allumnova
    volumes:
      - allumnova_db_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - allumnova-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d allumnova"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  redis:
    image: redis:alpine
    container_name: allumnova_redis
    networks:
      - allumnova-network
    restart: always

networks:
  allumnova-network:
    driver: bridge

volumes:
  allumnova_db_data:
