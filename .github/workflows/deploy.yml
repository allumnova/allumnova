name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          command_timeout: "10m"
          timeout: "60s"
          script: |
            cd ~/allumnova
            git pull origin main
            
            # Create directories for SSL
            mkdir -p certbot/conf certbot/www
            
            # Create .env file from secrets (Sanitized)
            echo "DATABASE_URL=\"$(echo "${{ secrets.DATABASE_URL }}" | xargs)\"" > .env
            echo "JWT_SECRET=\"$(echo "${{ secrets.JWT_SECRET }}" | xargs)\"" >> .env
            echo "REDIS_URL=redis://redis:6379" >> .env
            echo "NODE_ENV=production" >> .env
            echo "SMTP_HOST=\"$(echo "${{ secrets.SMTP_HOST }}" | xargs)\"" >> .env
            echo "SMTP_PORT=\"$(echo "${{ secrets.SMTP_PORT }}" | xargs)\"" >> .env
            echo "SMTP_USER=\"$(echo "${{ secrets.SMTP_USER }}" | xargs)\"" >> .env
            echo "SMTP_PASS=\"$(echo "${{ secrets.SMTP_PASS }}" | xargs)\"" >> .env
            echo "SMTP_FROM=\"$(echo "${{ secrets.SMTP_FROM }}" | xargs)\"" >> .env
            echo "FRONTEND_URL=\"$(echo "${{ secrets.FRONTEND_URL }}" | xargs)\"" >> .env

            docker compose down --remove-orphans || true
            docker rm -f allumnova_nginx allumnova_frontend allumnova_backend allumnova_worker allumnova_db allumnova_redis || true
            docker compose up -d --build
